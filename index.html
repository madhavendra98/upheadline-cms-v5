<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>UPHeadline News</title>

<link rel="stylesheet"
href="css/style.css">

<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

</head>

<body>

<!-- TOP BAR -->

<div class="topbar">

<div class="container">

<span>

<i class="ri-time-fill"></i>

<span id="liveDate"></span>

</span>

<div class="social">

<i class="ri-facebook-fill"></i>

<i class="ri-instagram-fill"></i>

<i class="ri-youtube-fill"></i>

<i class="ri-twitter-x-fill"></i>

</div>

</div>

</div>

<!-- HEADER -->

<header>

<div class="container header">

<a href="index.html">

<img src="images/logo.png"
class="logo">

</a>

<div class="search">

<input
type="text"
id="searchBox"
placeholder="Search News...">

<button>

<i class="ri-search-line"></i>

</button>

</div>

</div>

</header>

<!-- MENU -->

<nav>

<div class="container">

<ul>

<li><a href="#">Home</a></li>

<li><a href="#">UP</a></li>

<li><a href="#">India</a></li>

<li><a href="#">World</a></li>

<li><a href="#">Politics</a></li>

<li><a href="#">Business</a></li>

<li><a href="#">Sports</a></li>

<li><a href="#">Technology</a></li>

<li><a href="#">Entertainment</a></li>

</ul>

</div>

</nav>

<!-- BREAKING -->

<div class="breaking">

<div class="breaking-title">

BREAKING

</div>

<marquee
id="breakingNews">

Loading Breaking News...

</marquee>

</div>

<!-- HERO -->

<section class="hero">

<div class="container hero-grid">

<div
id="heroNews">

</div>

<div
id="sideNews">

</div>

</div>

</section>

<!-- LATEST -->

<section class="latest">

<div class="container">

<h2>

Latest News

</h2>

<div
id="latestNews"
class="news-grid">

</div>

</div>

</section>

<footer>

<div class="container">

© 2026

UPHeadline News

</div>

</footer>

<script
type="module"
src="js/app.js">

</script>

</body>

</html>
