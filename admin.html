<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UPHeadline CMS V5</title>

<link rel="stylesheet" href="css/admin.css">

<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">

</head>

<body>

<div class="sidebar">

<div class="logo">

<img src="images/logo.png">

<h2>UPHeadline CMS</h2>

</div>

<ul>

<li class="active" id="menu-dashboard">
<i class="ri-dashboard-fill"></i>
<span>Dashboard</span>
</li>

<li id="menu-publish">
<i class="ri-add-circle-fill"></i>
<span>Publish News</span>
</li>

<li id="menu-news">
<i class="ri-file-list-3-fill"></i>
<span>All News</span>
</li>

<li id="menu-breaking">
<i class="ri-fire-fill"></i>
<span>Breaking News</span>
</li>

<li id="menu-featured">
<i class="ri-star-fill"></i>
<span>Featured News</span>
</li>

<li id="menu-media">
<i class="ri-image-fill"></i>
<span>Media Library</span>
</li>

<li id="menu-settings">
<i class="ri-settings-4-fill"></i>
<span>Settings</span>
</li>

<li onclick="logout()">
<i class="ri-logout-box-r-fill"></i>
<span>Logout</span>
</li>

</ul>

</div>

<div class="main">

<header>

<div>

<h1>Dashboard</h1>

<p>Welcome to UPHeadline CMS V5</p>

</div>

<div class="admin-info">

<i class="ri-admin-fill"></i>

<span id="adminEmail">
Administrator
</span>

</div>

</header>

<div class="dashboard-grid">

<div class="dash-card red">

<h2 id="totalNews">0</h2>

<p>Total News</p>

</div>

<div class="dash-card blue">

<h2 id="breakingCount">0</h2>

<p>Breaking News</p>

</div>

<div class="dash-card green">

<h2 id="featuredNews">0</h2>

<p>Featured News</p>

</div>

<div class="dash-card orange">

<h2 id="categoryCount">0</h2>

<p>Categories</p>

</div>

</div>
<!-- ========================= -->
<!-- Publish News Section -->
<!-- ========================= -->

<section class="publish-box">

<h2>📰 Publish News</h2>

<div class="form-group">
<label>News Title</label>
<input type="text" id="title" placeholder="Enter News Title">
</div>

<div class="row">

<div class="form-group">
<label>Category</label>
<select id="category">
<option>UP News</option>
<option>India</option>
<option>World</option>
<option>Politics</option>
<option>Business</option>
<option>Sports</option>
<option>Technology</option>
<option>Entertainment</option>
</select>
</div>

<div class="form-group">
<label>Reporter Name</label>
<input type="text" id="reporter" placeholder="Reporter Name">
</div>

</div>

<div class="row">

<div class="form-group">
<label>Upload Image</label>
<input
type="file"
id="imageFile"
accept="image/*">

<img id="preview" class="preview">
</div>

<div class="form-group">
<label>Photo Caption</label>
<input
type="text"
id="caption"
placeholder="Photo Caption">
</div>

</div>

<div class="form-group">
<label>News Description</label>

<div id="editor"></div>
</div>

<div class="row">

<label>

<input
type="checkbox"
id="featured">

⭐ Featured News

</label>

<label>

<input
type="checkbox"
id="breaking">

🔥 Breaking News

</label>

</div>

<div class="form-group">

<label>SEO Title</label>

<input
type="text"
id="seoTitle"
placeholder="SEO Title">

</div>

<div class="form-group">

<label>SEO Description</label>

<textarea
id="seoDescription"
rows="4"
placeholder="SEO Description"></textarea>

</div>

<div class="form-group">

<label>Tags</label>

<input
type="text"
id="tags"
placeholder="news, politics, up">

</div>

<button
class="publish-btn"
onclick="publishNews()">

🚀 Publish News

</button>

<hr>

<h2>📰 Published News</h2>

<input
type="text"
id="search"
placeholder="🔍 Search News..."
onkeyup="searchNews()">

<br><br>

<div id="newsList"></div>

</section>
<!-- ========================= -->
<!-- Quill Editor -->
<!-- ========================= -->

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

<script>

window.quill = new Quill("#editor",{

theme:"snow",

placeholder:"Write your news here...",

modules:{

toolbar:[

[{header:[1,2,3,false]}],

["bold","italic","underline","strike"],

[{color:[]},{background:[]}],

[{list:"ordered"},{list:"bullet"}],

["blockquote","code-block"],

["link","image"],

["clean"]

]

}

});


// Image Preview

const imageInput=document.getElementById("imageFile");

const preview=document.getElementById("preview");

imageInput.addEventListener("change",function(e){

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(event){

preview.src=event.target.result;

preview.style.display="block";

}

reader.readAsDataURL(file);

});

</script>

<!-- Firebase Admin JS -->

<script type="module" src="js/admin.js"></script>

</div>

</body>

</html>
